# Commit prefixes feed the release notes (release-please-config.json): a runtime
# dependency ("deps") is listed under Dependencies and makes a patch release; a dev
# dependency ("chore") or an Actions bump ("ci") stays out of the notes.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "chore"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # The compose file pins the demo stack (InfluxDB, Grafana), not the Tributary image:
  # its bumps change no release, so "chore". Tributary writes through the InfluxDB 1.x
  # API, so a 2.x major is never proposed.
  - package-ecosystem: "docker-compose"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "influxdb"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
