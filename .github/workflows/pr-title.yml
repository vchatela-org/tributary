name: 🏷️ PR title

# Squash merges make the PR title the release-note line (and the version bump), so it
# must be a conventional commit. vchatela-org/shared-workflows, pr-title.yml.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, synchronize, reopened ]

permissions: {}

jobs:
  title:
    uses: vchatela-org/shared-workflows/.github/workflows/pr-title.yml@v1
