name: Privacy

# This repository is public: it ships a product, never its owner's data.
# The deny-list (.github/privacy-denylist.txt) plus the owner's own
# vocabulary (repository secret PRIVACY_DENYLIST_LOCAL), over the working
# tree and the whole history; and gitleaks for credentials.

on:
  push:
    branches: [ 'main' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denylist:
    name: Privacy deny-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the history scan needs every blob
          persist-credentials: false

      - name: Materialise the local deny-list supplement
        # The owner's own vocabulary can't be committed (it would publish
        # what it protects): it comes from a secret. Fork pull requests get
        # no secrets, hence a warning there and a failure on main below.
        env:
          SUPPLEMENT: ${{ secrets.PRIVACY_DENYLIST_LOCAL }}
        run: |
          if [[ -n "$SUPPLEMENT" ]]; then
            printf '%s\n' "$SUPPLEMENT" > .github/privacy-denylist.local.txt
            echo "local supplement: present"
          else
            echo "::warning title=Partial privacy scan::PRIVACY_DENYLIST_LOCAL is unset (fork PR?), so this run covers the public patterns only."
          fi

      - name: The scan must not run blind on main
        if: github.event_name != 'pull_request'
        run: |
          if [[ ! -s .github/privacy-denylist.local.txt ]]; then
            echo "::error::PRIVACY_DENYLIST_LOCAL is unset: the scan would report 'clean' with half its patterns missing."
            exit 1
          fi

      - name: Scan working tree
        # --redact-hits: in a public log the matched content IS the leak.
        run: ./scripts/privacy-scan.sh --redact-hits

      - name: Scan full history
        run: ./scripts/privacy-scan.sh --history --redact-hits

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks action needs a paid licence for organizations; the
      # scanner itself is free. Pinned: Dependabot doesn't watch it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks detect --redact --no-banner --exit-code 1
