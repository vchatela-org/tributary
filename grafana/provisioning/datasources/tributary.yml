# One InfluxQL datasource per database Tributary's dashboards read, named
# "InfluxDB <database>": each dashboard finds its own by that name. Add one per
# domain you graph next to them (SleepStats...).
apiVersion: 1

datasources:
  - name: InfluxDB MediaStats
    uid: tributary-influxdb-mediastats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: MediaStats
      httpMode: POST
    editable: true

  - name: InfluxDB BodyStats
    uid: tributary-influxdb-bodystats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: BodyStats
      httpMode: POST
    editable: true

  - name: InfluxDB TodoistStats
    uid: tributary-influxdb-todoiststats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: TodoistStats
      httpMode: POST
    editable: true
