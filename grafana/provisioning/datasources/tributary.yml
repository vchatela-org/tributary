# One InfluxQL datasource per database Tributary's dashboards read, named
# "InfluxDB <database>": each dashboard finds its own by that name. GarminStats
# is garmin-grafana's database, FitbitHealthStats fitbit-fetch's, and SleepStats
# the one a sleep source writes: until one exists, the panels reading it warn
# "database not found" and draw the other sources. Remove a datasource you will
# never fill.
apiVersion: 1

datasources:
  - name: InfluxDB MediaStats
    uid: tributary-influxdb-mediastats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: MediaStats
      httpMode: POST
    editable: true

  - name: InfluxDB BodyStats
    uid: tributary-influxdb-bodystats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: BodyStats
      httpMode: POST
    editable: true

  - name: InfluxDB TodoistStats
    uid: tributary-influxdb-todoiststats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: TodoistStats
      httpMode: POST
    editable: true

  - name: InfluxDB GarminStats
    uid: tributary-influxdb-garminstats
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: GarminStats
      httpMode: POST
    editable: true

  - name: InfluxDB FitbitHealthStats
    uid: tributary-influxdb-fitbithealthstats
    type: influxdb
