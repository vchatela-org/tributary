<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% if busy %}<meta http-equiv="refresh" content="5" />{% endif %}
  <title>{% block title %}Integrations{% endblock %} – Tributary</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Cpath d='M6 9c4 0 6 3 10 3s6-3 10-3v3c-4 0-6 3-10 3S10 12 6 12zm0 7c4 0 6 3 10 3s6-3 10-3v3c-4 0-6 3-10 3s-6-3-10-3z' fill='%23fff'/%3E%3C/svg%3E" />
  <script>
    // Before any paint: the OS theme, no flash of the wrong one.
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  </script>
  <!-- Served locally, never from a CDN -->
  <link rel="stylesheet" href="/static/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<nav class="topbar">
  <div class="container d-flex align-items-center gap-4">
    <a class="brand" href="/"><i class="bi bi-water me-2"></i>Tributary</a>
    {% set path = request.url.path %}
    <a class="nav-link {% if path == '/' %}active{% endif %}" href="/">Integrations</a>
    <a class="nav-link {% if path.startswith('/runs') %}active{% endif %}" href="/runs">Run history</a>
    <span class="ms-auto small text-body-secondary">v{{ app_version }}</span>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
